<button style="background:red;color:white;border:2px dashed white;padding:20px 30px;display:block;margin:200px auto 20px;" onclick="mostrar()">Clique aqui e se surpreenda</button>
<p id="mensagem"></p>

<script>
function mostrar() {
  document.getElementById("mensagem").innerText = "Eu te amo muito meu amor, desculpa as raivas que eu te passo e prometo melhorar.";

  document.getElementById("mensagem").style.fontSize = "32px";
  document.getElementById("mensagem").style.textAlign = "center";
}
</script>
